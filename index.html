<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCM 수요예측 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#2F6BEA; --pri-press:#2459C9; --pri-pale:#EAF1FE;
  --ink:#191F28; --ink2:#4E5968; --muted:#8B95A1; --line:#E5E8EB; --fill:#F2F4F6; --fill2:#F9FAFB;
  --ok:#0B8A5C; --ok-pale:#E3F5EC; --warn:#C25A00; --warn-pale:#FFF1E4; --bad:#D63B3B;
  --chartA:#2563B8; --chartF:#C96A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:#E9ECF1;font-size:15px;line-height:1.5;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}

/* phone frame */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(25,31,40,.18),0 0 0 10px #191F28}
@media (max-width:480px){.stage{padding:0}.phone{width:100%;height:100vh;border-radius:0;box-shadow:none}}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;transition:none}
.screen.enter{transform:translateX(100%)}
.screen.leave{transform:translateX(-28%);opacity:.6}
.screen.enter-back{transform:translateX(-28%);opacity:.6}
.screen.leave-back{transform:translateX(100%)}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 8px;gap:4px}
.topbar .title{flex:1;text-align:center;font-weight:700;font-size:16px;margin-right:40px}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.iconbtn:active{background:var(--fill)}
.chap{display:flex;gap:4px;padding:0 20px 6px}
.chap div{flex:1;text-align:center;font-size:11px;font-weight:700;color:#B0B8C1}
.chap div i{display:block;height:3px;border-radius:2px;background:var(--fill);margin-bottom:5px}
.chap div.done i{background:#A9C2F6}
.chap div.on{color:var(--pri)}.chap div.on i{background:var(--pri)}
.body{flex:1;overflow-y:auto;padding:12px 24px 24px;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:0}
.cta{flex:0 0 auto;padding:12px 20px 22px;background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0));display:flex;gap:8px}
.btn{flex:1;height:56px;border:0;border-radius:16px;background:var(--pri);color:#fff;font-weight:700;font-size:16.5px;transition:none}
.btn:active{transform:scale(.98);background:var(--pri-press)}
.btn.sub{background:var(--fill);color:var(--ink2)}
.btn.sub:active{background:#E5E8EB}
.btn:disabled{background:#C9D6F5;cursor:not-allowed}

/* type */
.eyebrow{font-size:13px;font-weight:700;color:var(--pri);margin:4px 0 6px}
h1{font-size:25px;line-height:1.38;font-weight:800;margin:0 0 10px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--pri)}
.lead{color:var(--ink2);font-size:15px;margin:0 0 22px}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:26px 0 10px}
.src{font-size:11.5px;color:var(--muted);margin-top:20px;line-height:1.55}
.small{font-size:13px;color:var(--ink2)}
.mute{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* blocks */
.card{background:var(--fill2);border-radius:18px;padding:16px 18px}
.card + .card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0}
.row + .row{border-top:1px solid var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{font-size:13px;color:var(--ink2)}
.ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--pri-pale);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.ic.o{background:var(--warn-pale);color:var(--warn)}
.ic.g{background:var(--ok-pale);color:var(--ok)}
.ic.k{background:var(--fill);color:var(--ink2)}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.big small{font-size:18px;font-weight:700;color:var(--ink2);margin-left:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--fill2);border-radius:16px;padding:14px 12px}
.stat .v{font-size:26px;font-weight:800;color:var(--pri);line-height:1.15}
.stat .l{font-size:12.5px;font-weight:700;margin-top:2px}
.stat .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-pale);color:var(--ok)}
.pill.warn{background:var(--warn-pale);color:var(--warn)}
.pill.pri{background:var(--pri-pale);color:var(--pri)}
.pill.k{background:var(--fill);color:var(--ink2)}
.tapcard{width:100%;text-align:left;border:0;background:var(--fill2);border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:12px}
.tapcard:active{background:var(--fill)}
.tapcard + .tapcard{margin-top:10px}
.chev{color:#B0B8C1;font-size:18px}
.hero{background:var(--pri);color:#fff;border-radius:22px;padding:22px 20px;margin-top:6px}
.hero .k{font-size:13px;opacity:.85;font-weight:700}
.hero .h{font-size:21px;font-weight:800;line-height:1.4;margin:6px 0 16px}
.hero button{border:0;background:#fff;color:var(--pri);font-weight:800;border-radius:12px;padding:11px 16px}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.steps li b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--fill);color:var(--ink2);font-size:13px;display:flex;align-items:center;justify-content:center}
.steps li.hot b{background:var(--warn-pale);color:var(--warn)}
.steps .t{font-weight:700;font-size:14.5px}
.steps .s{font-size:12.5px;color:var(--ink2)}
.quote{border-left:3px solid var(--pri);padding:2px 0 2px 12px;font-size:14px;color:var(--ink);margin:6px 0 8px}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.matrix div{border-radius:14px;padding:14px 10px;text-align:center;font-size:12.5px;color:var(--ink2);min-height:78px;display:flex;flex-direction:column;justify-content:center}
.matrix div b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.matrix .hot{background:var(--pri);color:#DCE7FD}.matrix .hot b{color:#fff}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.flow .n{background:var(--fill2);border-radius:14px;padding:11px 14px;font-size:14px}
.flow .n b{color:var(--ink)}
.flow .n .s{font-size:12px;color:var(--ink2)}
.flow .d{background:#fff;border:1.5px dashed var(--pri);color:var(--pri);border-radius:14px;padding:9px 14px;font-size:13.5px;font-weight:700}
.flow .ar{text-align:center;color:#B0B8C1;font-size:12px;line-height:1}
.ladder div{border-radius:14px;padding:12px 14px;background:var(--fill2);margin-bottom:6px}
.ladder div.hot{background:var(--warn-pale)}
.ladder b{font-size:14px}
.ladder span{display:block;font-size:12.5px;color:var(--ink2)}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp td{padding:11px 4px;border-top:1px solid var(--fill)}
.cmp tr:first-child td{border-top:0}
.cmp td:first-child{color:var(--ink2);width:30%}
.cmp .a{color:var(--muted);text-decoration:line-through;text-decoration-color:#C9CED4}
.cmp .b{font-weight:800}
.cmp .tg{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}

/* list rows for models */
.mrow{width:100%;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:14px 2px}
.mrow + .mrow{border-top:1px solid var(--fill)}
.mrow:active{background:var(--fill2)}
.mrow .nm{font-weight:700}
.mrow .sb{font-size:12.5px;color:var(--muted)}
.mrow .val{font-weight:800;text-align:right}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.chip.on{border-color:var(--pri);background:var(--pri-pale);color:var(--pri)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--fill2);border-radius:16px;padding:8px}
.stepper button{width:44px;height:44px;border:0;border-radius:12px;background:#fff;font-size:22px;font-weight:700;color:var(--ink2)}
.stepper input{width:120px;text-align:center;border:0;background:transparent;font-size:26px;font-weight:800}
.stepper input:focus{outline:none}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px}
.field:focus{outline:none;border-color:var(--pri)}
.check{display:flex;gap:12px;align-items:center;padding:12px 0}
.check .dot{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--fill);color:#B0B8C1;transition:none}
.check.done .dot{background:var(--pri);color:#fff}
.check.warn .dot{background:var(--warn);color:#fff}
.check .t{font-weight:700}
.check .s{font-size:12.5px;color:var(--ink2)}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--fill)}
.role{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.role.on{border-color:var(--pri);background:var(--pri-pale)}
.role .r{width:22px;height:22px;border-radius:50%;border:2px solid #C9CED4;flex:0 0 22px}
.role.on .r{border:7px solid var(--pri)}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid var(--pri-pale);border-top-color:var(--pri);animation:sp 0.9s linear infinite;margin:40px auto 24px}
@keyframes sp{to{transform:rotate(360deg)}}
.donecheck{width:84px;height:84px;border-radius:50%;background:var(--pri);margin:36px auto 22px;display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.feed .row .s{font-size:12px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--fill2);border-radius:12px;padding:12px;white-space:pre;overflow-x:auto;color:var(--ink2)}
.banner{background:var(--warn-pale);color:var(--warn);font-size:12.5px;font-weight:700;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.chartwrap{position:relative;margin:4px -4px 0}
.chartwrap svg{display:block;width:100%;height:auto}
.ctip{position:absolute;top:4px;background:#191F28;color:#fff;border-radius:10px;padding:6px 9px;font-size:11.5px;pointer-events:none;opacity:0;transition:none;white-space:nowrap}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}

/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:none;z-index:20}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 24px 24px;transform:translateY(105%);transition:none;z-index:21}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);background:rgba(25,31,40,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:none;pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
input[type=range]{width:100%;accent-color:var(--pri)}

/* Five direct-access tabs: motion is visual-only and never blocks page changes. */
.tabnav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));border-top:1px solid #EDF0F4;background:#fff;z-index:5;box-shadow:0 -4px 18px rgba(20,39,70,.03)}
.tabitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:3px 0;border:0;border-radius:12px;background:transparent;color:#8B95A5;font-size:10px;font-weight:750;-webkit-tap-highlight-color:transparent}
.tabitem .tabicon{width:36px;height:28px;border-radius:10px;display:grid;place-items:center;transition:background .12s ease,transform .12s ease;color:inherit}
.tabitem svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabitem.on{color:#285FD3}.tabitem.on .tabicon{background:#E8F0FF}
.tabitem:active .tabicon{transform:scale(.91)}.tabitem:focus-visible{outline:2px solid #285FD3;outline-offset:1px}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 8px}
.quicktile{min-height:88px;text-align:left;border:1px solid #E4EAF4;background:#F8FAFE;border-radius:16px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;gap:9px}
.quicktile:active{background:#EBF2FF}.quicktile b{font-size:14px;color:#191F28}.quicktile small{font-size:11px;color:#788492;font-weight:550}
.setting-profile{display:flex;align-items:center;gap:13px;padding:17px;border:1px solid #E4EAF4;border-radius:18px;background:linear-gradient(125deg,#F7FAFF,#EFF5FF);margin:12px 0 15px}
.setting-profile .grow{flex:1;min-width:0}
.audit-store{border:1px solid #DCE8FB;border-radius:16px;padding:14px;background:#F7FAFF;margin-top:10px}
.audit-store .status{font-size:12px;font-weight:750;color:#1A7D54}
.audit-store code{display:inline-block;color:#285FD3;font:600 12px ui-monospace,Menlo,monospace;margin-top:6px;word-break:break-word}
.audit-filter{display:flex;gap:6px;overflow-x:auto;padding:3px 0 11px;scrollbar-width:none}.audit-filter::-webkit-scrollbar{display:none}
.audit-filter button{flex:0 0 auto;padding:9px 12px;border-radius:999px;border:1px solid #E4EAF4;background:#fff;color:#667080;font-size:12px;font-weight:700}
.audit-filter button.on{background:#285FD3;color:#fff;border-color:#285FD3}
.audit-entry{display:flex;gap:11px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #EEF1F6}.audit-entry:last-child{border-bottom:0}
.audit-mark{flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;border-radius:11px;background:#EDF3FF;color:#285FD3;font-weight:800;font-size:13px}
.audit-entry .grow{flex:1;min-width:0}.audit-entry .t{font-size:13.5px;font-weight:700;line-height:1.5;color:#202A38;overflow-wrap:anywhere}
.audit-entry .s{margin-top:3px;font-size:11.5px;color:#84909E}
.audit-empty{padding:25px 14px;border-radius:15px;background:#F7F8FA;text-align:center;color:#8590A0;font-size:13px}
.audit-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.audit-meta button{border:0;background:#EDF3FF;color:#285FD3;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:750}
@media(prefers-reduced-motion:reduce){.tabitem .tabicon{transition:none!important}}
</style>
</head>
<body>
<div class="stage"><div class="phone" id="phone">
  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>
</div></div>

<script>
/* =========================================================
   1. 기본 데이터 (서버에 데이터가 없을 때만 쓰는 예시값)
   ========================================================= */
const SAMPLE = {
  start:{y:2024,m:11},
  series:{
    "세단 A":[1081,1107,1098,1129,1150,1217,1296,1290,1310,1265,1244,1210,1129,1215,1220,1253,1220,1260,1323,1355,1380,1351,1344,1277],
    "세단 B":[799,796,773,843,830,861,827,828,832,825,826,799,769,751,765,819,784,825,841,797,830,848,748,773],
    "SUV C":[1252,1224,1307,1338,1351,1513,1561,1601,1622,1554,1505,1408,1461,1412,1448,1470,1551,1637,1766,1661,1684,1729,1738,1664],
    "SUV D":[435,385,584,551,576,761,806,760,755,734,762,654,614,605,484,704,733,756,633,733,817,614,672,703],
    "전기차 E":[275,319,332,351,383,413,434,465,467,484,509,513,519,554,580,588,608,646,672,692,726,718,751,741],
    "소형 F":[295,307,312,313,313,316,319,325,316,317,315,305,309,306,321,308,306,311,318,328,null,318,327,281]
  },
  orders:[
    {no:"D-1001",dealer:"광주 상무점",model:"세단 A",qty:120},{no:"D-1002",dealer:"서울 강남점",model:"SUV C",qty:210},
    {no:"D-1003",dealer:"부산 해운대점",model:"전기차 E",qty:140},{no:"D-1004",dealer:"대전 둔산점",model:"세단 B",qty:90},
    {no:"D-1005",dealer:"광주 상무점",model:"SUV D",qty:75},{no:"D-1006",dealer:"서울 강남점",model:"세단 A",qty:160},
    {no:"D-1007",dealer:"부산 해운대점",model:"SUV C",qty:180},{no:"D-1007",dealer:"부산 해운대점",model:"SUV C",qty:180},
    {no:"D-1008",dealer:"대전 둔산점",model:"전기차 E",qty:110},{no:"D-1009",dealer:"광주 첨단점",model:"",qty:60},
    {no:"D-1010",dealer:"서울 마포점",model:"소형 F",qty:45},{no:"D-1004",dealer:"대전 둔산점",model:"세단 B",qty:90}
  ]
};
const ROLES = ["SCM 수요계획팀","영업팀","생산기획팀"];
const TEAM = "HINT 2기 1조";
const TEAM_MEMBERS = ["장인우","정재엽","양건휘","장우람","김주영"];
// 실제 계정 및 서버 저장과 격리된 체험 계정
const DEMO_ACCOUNT = {id:"__demo__",name:"체험 사용자",role:"SCM 수요계획팀",hasPin:true,loginCount:0};

/* =========================================================
   2. 상태
   ========================================================= */
const S = {
  online:false, demo:false, planStatus:null, uid:null, me:null, canWrite:null, role:null, member:null,
  dataset: clone(SAMPLE), datasetFromServer:false,
  limit:8, method:{}, special:{}, agreed:{},
  plans:[], activity:[], accounts:[], account:null, lastSaved:null,
  auditLogs:[], auditTotal:0, auditFilter:"all", auditStatus:"idle", auditLoading:false, auditError:null
};
let user=null;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(n==null||!isFinite(n))?"–":Math.round(n).toLocaleString("ko-KR");
const p1=n=>(n==null||!isFinite(n))?"–":n.toFixed(1)+"%";
function mLabel(i){ const t=S.dataset.start.y*12+(S.dataset.start.m-1)+i; return `${Math.floor(t/12)}.${String(t%12+1).padStart(2,"0")}`; }
function nLen(){ return Object.values(S.dataset.series)[0].length; }
function planMonth(){ return mLabel(nLen()).replace(".","-"); }
function planMonthKo(){ const [y,m]=planMonth().split("-"); return `${+m}월`; }

async function api(path,opt={}){
  const r=await fetch("/api/"+path,{method:opt.method||"GET",headers:opt.body?{"content-type":"application/json"}:{},body:opt.body?JSON.stringify(opt.body):undefined,credentials:"same-origin",cache:"no-store"});
  let d={}; try{ d=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error(d.error||"서버 오류"); err.status=r.status; err.data=d; throw err; }
  return d;
}
function applyBoot(d){
  S.accounts=d.accounts||[]; S.plans=d.plans||[]; S.activity=d.activity||[]; S.server=d.server;
  if(d.dataset&&d.dataset.series&&!S.editing){ S.dataset={start:d.dataset.start,series:clone(d.dataset.series),orders:clone(d.dataset.orders||[])}; S.datasetFromServer=true; S.lastSaved={by:d.dataset.updatedBy,at:d.dataset.updatedAt}; }
  if(d.me){ S.account=d.me; S.role=d.me.role; S.sessionId=d.me.sessionId; S.sessionStart=d.me.sessionStart; if(d.me.limit) S.limit=d.me.limit; }
  else if(S.account){ S.account=null; }
}
async function boot(){
  try{ const d=await api("bootstrap"); S.online=true; applyBoot(d); if(d.me) S.resumed=true; }
  catch(e){ S.online=false; seedLocal(); }
  setInterval(poll,15000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(); });
  return S.online;
}
async function poll(){ // 15초마다 팀 데이터 새로고침 (다른 사람 작업 반영)
  if(!S.online||document.hidden) return;
  try{ const had=!!S.account; const d=await api("bootstrap"); applyBoot(d);
    if(had&&!d.me){ S.account=null; nav.reset("login"); toast("로그인이 끝났어요. 다시 로그인해 주세요"); return; }
    if(!["pin","signup","exception","loading","confirm"].includes(nav.cur())) refresh(); }catch(e){}
}

   4. 수요예측 엔진
   ========================================================= */
const METHODS={
  ma3:{name:"3개월 이동평균",short:"이동평균",desc:"최근 3개월 평균",min:3,run(y,h){const v=(y[y.length-1]+y[y.length-2]+y[y.length-3])/3;return Array(h).fill(v);}},
  ses:{name:"단순 지수평활",short:"지수평활",desc:"최근 값에 더 큰 비중",min:2,run(y,h){let L=y[0];for(let i=1;i<y.length;i++)L=.4*y[i]+.6*L;return Array(h).fill(L);}},
  holt:{name:"추세 반영",short:"추세",desc:"증가·감소 추세를 이어감",min:3,run(y,h){let L=y[0],T=y[1]-y[0];for(let i=1;i<y.length;i++){const p=L;L=.5*y[i]+.5*(L+T);T=.3*(L-p)+.7*T;}return Array.from({length:h},(_,k)=>L+(k+1)*T);}},
  hw:{name:"계절 반영",short:"계절",desc:"추세 + 12개월 계절 패턴",min:13,run(y,h){const m=12;let L=y.slice(0,m).reduce((s,v)=>s+v,0)/m;let T=y.length>=2*m?(y.slice(m,2*m).reduce((s,v)=>s+v,0)/m-L)/m:(y[m]-y[0])/m;const Sn=y.slice(0,m).map(v=>v-L);for(let i=m;i<y.length;i++){const s=Sn[i%m],p=L;L=.3*(y[i]-s)+.7*(L+T);T=.1*(L-p)+.9*T;Sn[i%m]=.3*(y[i]-L)+.7*s;}const n=y.length;return Array.from({length:h},(_,k)=>L+(k+1)*T+Sn[(n+k)%m]);}}
};
const BT=6,H=3;
function backtest(y,k){const M=METHODS[k],fc=[],e=[],ape=[];for(let t=y.length-BT;t<y.length;t++){if(t<M.min){fc.push(null);continue;}const f=M.run(y.slice(0,t),1)[0];fc.push(f);e.push(y[t]-f);ape.push(Math.abs(y[t]-f)/y[t]*100);}return{fc,mape:ape.reduce((s,v)=>s+v,0)/ape.length,sd:Math.sqrt(e.reduce((s,v)=>s+v*v,0)/e.length)};}
function analyze(name){
  const y=S.dataset.series[name].map(Number);
  const res={}; for(const k in METHODS) if(y.length>=METHODS[k].min+BT) res[k]=backtest(y,k);
  const best=Object.keys(res).reduce((a,k)=>(a==null||res[k].mape<res[a].mape)?k:a,null);
  const key=(S.method[name]&&res[S.method[name]])?S.method[name]:best;
  const future=METHODS[key].run(y,H), r=res[key];
  const band=future.map((f,k)=>[Math.max(0,f-1.96*r.sd*Math.sqrt(k+1)),f+1.96*r.sd*Math.sqrt(k+1)]);
  const why=[]; if(r.mape>S.limit) why.push(`최근 오차 ${p1(r.mape)}가 기준 ±${S.limit}%보다 커요`); if(S.special[name]) why.push("특이 상황으로 표시했어요");
  return {name,y,res,best,key,future,band,r,why,exception:why.length>0};
}
function analyzeAll(){ return Object.keys(S.dataset.series).map(analyze); }
function issues(){
  const seen=new Set(),dups=[],missing=[];
  S.dataset.orders.forEach((o,i)=>{ if(seen.has(o.no)) dups.push(i); else seen.add(o.no); if(!o.model) missing.push(i); });
  const gaps=[]; for(const k in S.dataset.series) S.dataset.series[k].forEach((v,i)=>{ if(v==null||v==="") gaps.push({model:k,i}); });
  return {dups,missing,gaps};
}

  cta:()=>({label:"직접 해보기",go:"merge"}) },

/* ---------- 데모: ① 입력·통합 ---------- */
merge:{ ch:3, title:"① 입력·통합", html:()=>{
    const is=issues(), n=Object.keys(S.dataset.series).length;
    return `<h1>판매·딜러 데이터를<br>하나로 모았어요</h1>
      <p class="lead">${S.datasetFromServer?`서버의 최신 데이터예요${S.lastSaved?.at?` · ${when(S.lastSaved.at)} 저장`:""}`:"예시 데이터로 시작해요 (가상의 숫자)"}</p>
      <div id="mergeChecks">
        ${[["판매실적",`${n}개 차종 · ${nLen()}개월`,"done"],["딜러주문",`${S.dataset.orders.length}건 접수`,"done"],["중복 주문 제외",`같은 주문번호 ${is.dups.length}건을 합계에서 뺐어요`,"done"],
           ["확인 필요",(is.gaps.length+is.missing.length)?`빈 값 ${is.gaps.length}칸 · 차종 누락 ${is.missing.length}건`:"없어요",(is.gaps.length+is.missing.length)?"warn":"done"]]
          .map((c,i)=>`<div class="check" data-i="${i}"><div class="dot">${c[2]==="warn"?"!":"✓"}</div><div><div class="t">${c[0]}</div><div class="s">${c[1]}</div></div></div>`).join("")}
      </div>
      <div class="card small" style="margin-top:14px">E·C·R·S 중 <b style="color:var(--ink)">C 합치기 · R 바꾸기</b> — 담당자가 따로 모으던 자료를 한 번에 받고, 중복은 기계가 걸러요.</div>`; },
  mount:el=>{ const is=issues(); el.querySelectorAll(".check").forEach((c,i)=>c.classList.add(i===3&&(is.gaps.length+is.missing.length)?"warn":"done")); },
  cta:()=>{ const is=issues(); return {label:(is.gaps.length+is.missing.length)?"확인하러 가기":"예측하기", go:(is.gaps.length+is.missing.length)?"fix":"loading"}; } },

/* ---------- 데모: 판단 A / ③ 수정 ---------- */
fix:{ ch:3, title:"◇ 판단 A", html:()=>{
    const is=issues(); const total=is.gaps.length+is.missing.length;
    if(!total) return `<h1>모두 기준 안이에요</h1><p class="lead">데이터 품질과 필수 항목을 통과했어요. 예측으로 넘어갈게요.</p><div class="donecheck" style="width:64px;height:64px">${ICON.check}</div>`;
    return `<h1>${total}개만 확인하면<br>예측할 수 있어요</h1>
      <p class="lead">기준을 못 맞춘 건만 모았어요. 오류 데이터가 그대로 통과하지 않게 해요.</p>
      ${is.gaps.map(g=>{ const s=S.dataset.series[g.model]; const prev=s.slice(0,g.i).reverse().find(v=>v!=null), next=s.slice(g.i+1).find(v=>v!=null); const guess=Math.round(((prev??next)+(next??prev))/2);
        return `<div class="card"><span class="pill warn">빈 값</span><div style="font-weight:800;font-size:17px;margin:8px 0 2px">${g.model} · ${mLabel(g.i)} 판매실적</div>
          <div class="small">앞뒤 달 평균으로 채우면 <b style="color:var(--ink)">${fmt(guess)}대</b> (추정치)</div>
          <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="height:44px;font-size:14.5px" data-fill="${g.model}|${g.i}|${guess}">추정치로 채우기</button><button class="btn sub" style="height:44px;font-size:14.5px" data-input="${g.model}|${g.i}">직접 입력</button></div></div>`; }).join("")}
      ${is.missing.map(i=>{ const o=S.dataset.orders[i]; return `<div class="card"><span class="pill warn">차종 누락</span><div style="font-weight:800;font-size:17px;margin:8px 0 2px">딜러주문 ${o.no}</div><div class="small">${o.dealer} · ${o.qty}대 · 차종을 골라 주세요</div>
          <div class="chips" style="margin-top:12px">${Object.keys(S.dataset.series).map(k=>`<button class="chip" data-assign="${i}|${k}">${k}</button>`).join("")}<button class="chip" data-assign="${i}|__drop">주문 제외</button></div></div>`; }).join("")}`; },
  cta:()=>{ const is=issues(); const ok=!(is.gaps.length+is.missing.length); return {label:ok?"예측하기":"모두 확인하면 다음으로", disabled:!ok, go:"loading"}; } },

/* ---------- 데모: ② 예측 중 ---------- */
loading:{ ch:3, title:"② 수요예측", noBack:true, html:()=>`<div style="text-align:center"><div class="spin"></div><h1>4가지 방법으로<br>예측해 보고 있어요</h1>
    <p class="lead">지난 6개월을 모른다고 치고 미리 맞혀 본 뒤,<br>차종마다 가장 잘 맞은 방법을 골라요.</p>
    <div class="card" style="text-align:left" id="ldList">${Object.values(METHODS).map(m=>`<div class="check"><div class="dot">✓</div><div><div class="t">${m.name}</div><div class="s">${m.desc}</div></div></div>`).join("")}</div></div>`,
  mount:el=>{ el.querySelectorAll("#ldList .check").forEach(c=>c.classList.add("done")); if(nav.cur()==="loading") nav.replace("result"); },
  cta:()=>null },

/* ---------- 데모: 예측 결과 ---------- */
result:{ ch:3, title:"② 수요예측", html:()=>{
    const A=analyzeAll(); const sum=A.reduce((s,a)=>s+a.future[0],0); const ex=A.filter(a=>a.exception);
    return `<div class="eyebrow">${planMonthKo()} 예측 합계</div>
      <div class="big num">${fmt(sum)}<small>대</small></div>
      <p class="lead" style="margin-top:8px">${A.length}개 차종 중 <b style="color:var(--ink)">${A.length-ex.length}개는 바로 확정</b>할 수 있어요.${ex.length?` ${ex.length}개만 같이 확인해요.`:""}</p>
      <button class="chip" data-sheet="limit" style="margin-bottom:6px">자동 확정 기준 · 오차 ±${S.limit}% ›</button>
      <div style="margin-top:8px">${A.map(a=>`<button class="mrow" data-model="${esc(a.name)}">
          <div class="ic ${a.exception?'o':'g'}">${a.exception?'!':'✓'}</div>
          <div style="flex:1;min-width:0"><div class="nm">${esc(a.name)}</div><div class="sb">${METHODS[a.key].name} · 오차 ${p1(a.r.mape)}</div></div>
          <div><div class="val num">${fmt(a.future[0])}대</div><div style="text-align:right"><span class="pill ${a.exception?'warn':'ok'}">${a.exception?'협의':'자동'}</span></div></div></button>`).join("")}</div>
      <div class="src">오차 = 최근 6개월 백테스트 평균 오차(MAPE). 예측은 통계 방법이며, 기획서의 'AI 자리'를 대신하는 시제품이에요.</div>`; },
  cta:()=>{ const ex=analyzeAll().filter(a=>a.exception).length; return {label:ex?`예외 ${ex}건 확인하기`:"계획 확정하기", go:ex?"exception":"confirm"}; } },

/* ---------- 데모: 차종 상세 ---------- */
detail:{ ch:3, title:"차종 상세", html:()=>{
    const a=analyze(S.selModel);
    return `<div class="eyebrow">${esc(a.name)}</div>
      <div class="big num">${fmt(a.future[0])}<small>대</small></div>
      <div class="small" style="margin:6px 0 14px">${planMonthKo()} 예측 · 예상 범위 ${fmt(a.band[0][0])}~${fmt(a.band[0][1])}대 · <span class="pill ${a.exception?'warn':'ok'}">${a.exception?'협의':'자동 확정'}</span></div>
      <div class="chartwrap" id="chart">${chartSVG(a)}<div class="ctip" id="ctip"></div></div>
      <div class="legend"><span><i style="border-color:var(--chartA)"></i>실적</span><span><i style="border-color:var(--chartF);border-top-style:dashed"></i>예측</span><span><i style="border-color:#F3D3AE;border-top-width:7px"></i>예상 범위</span></div>
      <div class="sec">예측 방법 · 최근 6개월 오차</div>
      <div class="seg">${Object.keys(a.res).map(k=>`<button class="${k===a.key?'on':''}" data-method="${k}">${METHODS[k].short} ${p1(a.res[k].mape)}${k===a.best?' ★':''}</button>`).join("")}</div>
      <div class="small" style="margin-top:8px">★ 가장 잘 맞은 방법 · 지금: ${METHODS[a.key].name} (${METHODS[a.key].desc})</div>
      <div class="sec">앞으로 3개월</div>
      ${a.future.map((f,k)=>`<div class="row"><div class="grow"><div class="t">${mLabel(a.y.length+k)}</div><div class="s">범위 ${fmt(a.band[k][0])}~${fmt(a.band[k][1])} · 작년 ${fmt(a.y[a.y.length+k-12])}</div></div><b class="num">${fmt(f)}대</b></div>`).join("")}
      <label class="row" style="cursor:pointer"><div class="grow"><div class="t">특이 상황</div><div class="s">대규모 주문, 공급 제약 등 → 예외로 보내요</div></div><input type="checkbox" data-special="${esc(a.name)}" ${S.special[a.name]?'checked':''} style="width:22px;height:22px;accent-color:var(--pri)"></label>`; },
  mount:el=>bindChart(el), cta:()=>({label:"확인",go:()=>nav.back()}) },

/* ---------- 데모: 판단 B / 예외 ---------- */
exception:{ ch:3, title:"◇ 판단 B", html:()=>{
    const ex=analyzeAll().filter(a=>a.exception);
    return `<h1>${ex.map(a=>esc(a.name)).join(", ")}만<br>같이 확인하면 돼요</h1>
      <p class="lead">나머지는 기준 안이라 회의 없이 확정돼요. 영업·생산기획과 정한 수량을 넣어 주세요.</p>
      ${ex.map(a=>{ const g=S.agreed[a.name]||(S.agreed[a.name]={qty:Math.round(a.future[0]),memo:""});
        return `<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">${esc(a.name)}</b><span class="pill warn">협의</span></div>
          <div class="small" style="margin:4px 0 12px">${a.why.join(" · ")}<br>예측 ${fmt(a.future[0])}대 · 예상 범위 ${fmt(a.band[0][0])}~${fmt(a.band[0][1])}대</div>
          <div class="stepper"><button data-step="${esc(a.name)}|-10">−</button><input class="num" inputmode="numeric" data-qty="${esc(a.name)}" value="${g.qty}"><button data-step="${esc(a.name)}|10">+</button></div>
          <div class="chips" style="margin-top:10px">${["영업 확인 완료","생산 여력 반영","프로모션 반영","예측값 유지"].map(m=>`<button class="chip ${g.memo===m?'on':''}" data-memo="${esc(a.name)}|${m}">${m}</button>`).join("")}</div></div>`; }).join("")}`; },
  cta:()=>({label:"판매계획 확정하기",go:"confirm"}) },

/* ---------- 데모: ⑤ 확정·공유 ---------- */
confirm:{ ch:3, title:"⑤ 확정·공유", noBack:true, html:()=>{
    const p=S.lastPlan; if(!p) return `<div class="spin"></div>`;
    return `<div style="text-align:center"><div class="donecheck">${ICON.check}</div>
      <h1>${planMonthKo()} 판매계획을<br>확정했어요</h1><p class="lead">${S.online?(S.planStatus==="saved"?"팀 서버에 저장했어요. 팀원 누구나 기록에서 볼 수 있어요.":S.planStatus==="failed"?"서버 저장에 실패했어요. 다시 확인해 주세요.":"팀 서버에 저장하고 있어요…"):"체험 모드라 실제 서버에는 저장되지 않았어요."}</p></div>
      <div class="stats"><div class="stat"><div class="v">${p.auto}</div><div class="l">자동 확정</div><div class="d">회의 없음</div></div>
        <div class="stat"><div class="v" style="color:var(--warn)">${p.exceptions}</div><div class="l">협의 확정</div><div class="d">예외만 회의</div></div>
        <div class="stat"><div class="v" style="font-size:20px;padding-top:6px">${fmt(p.total)}</div><div class="l">합계(대)</div><div class="d">생산·납기로 연계</div></div></div>
      <div class="card" style="margin-top:12px">${p.items.map(i=>`<div class="row"><div class="grow"><div class="t">${esc(i.model)}</div><div class="s">${i.status}${i.memo?` · ${esc(i.memo)}`:""}</div></div><b class="num">${fmt(i.qty)}대</b></div>`).join("")}</div>
      <button class="btn sub" style="width:100%;margin-top:12px;flex:none" data-copy>공유 요약 복사</button>`; },
  enter:()=>{ const A=analyzeAll(); void savePlan(A); },
  cta:()=>({label:"기대효과 보기",go:"effect"}) },

/* ---------- 기대효과 ---------- */
effect:{ ch:4, html:()=>{
    const p=S.lastPlan||S.plans[0];
    return `<div class="eyebrow">기대효과 · 그러면 무엇이 달라지나</div>
      <h1>일반 건은 회의 없이 확정되고,<br>사람은 <em>예외 판단</em>에만 써요</h1>
      ${p?`<div class="card" style="background:var(--pri-pale);margin:14px 0 4px"><b style="color:var(--pri)">방금 해본 결과</b><div style="font-size:14.5px;margin-top:2px">회의에 올릴 건이 <b>${p.items.length}건 → ${p.exceptions}건</b>으로 줄었어요 (화면에서 셈)</div></div>`:""}
      <div class="sec">전후 비교</div>
      <table class="cmp">${[["단계 수","8단계","5단계 + 판단 2개","흐름도에서 셈"],["대기 지점","모든 건 합의·승인","예외 건만 협의","흐름도에서 셈"],["담당","오차 검토를 영업과","SCM이 자체 분석","흐름도에서 셈"],["리드타임","약 7일","약 4일","가정"],["회의","주 3회","주 1회 이하","가정"],["예측 오차율","약 15%","약 10%","가정"]]
        .map(r=>`<tr><td>${r[0]}</td><td><span class="a">${r[1]}</span><br><span class="b">${r[2]}</span></td><td class="tg">${r[3]}</td></tr>`).join("")}</table>
      <div class="small" style="margin-top:8px"><b style="color:var(--ink)">늘어나는 일</b> 데이터 통합·검증, 판단 기준 관리, 실적 모니터링</div>
      <div class="sec">무엇이 줄어드나</div>
      <div class="chips"><span class="chip">대기 · 회의·의사결정 지연</span><span class="chip">중복 작업 · 반복 분석</span><span class="chip">업무 부담 · 수작업 수집</span></div>
      <div class="src">리드타임 7→4일, 회의 주3→1회 이하, 오차율 15→10%는 측정 실적이 아닌 예시 목표치(가정)예요. 현업 데이터 확인 후 확정해요.</div>`; },
  cta:()=>({label:"다음",go:"risk"}) },

risk:{ ch:4, html:()=>`<div class="eyebrow">기대효과 · 무엇이 불확실한가</div>
    <h1>가장 큰 리스크는<br>효과 숫자가 <em>아직 가정</em>이라는 점</h1>
    <p class="lead">현업 데이터로 먼저 재고, 수집 양식 통일부터 작게 시작해요.</p>
    <div class="sec" style="margin-top:6px">가정 → 확인 방법</div>
    ${[["리드타임 약 7일 → 약 4일","회차별 수립·승인 소요시간 실측"],["회의 주 3회 → 주 1회 이하","회의 기록에서 일반/예외 비율 확인"],["오차율 약 15% → 약 10%","최근 예측값과 실제 수주 비교"],["일반 건도 매번 회의를 거친다","영업·생산기획 담당자 인터뷰"],["판단 기준 (예: 오차 ±X%)","세 팀이 함께 정해 시범 적용"]]
      .map(r=>`<div class="row"><div class="grow"><div class="t" style="font-size:14px">${r[0]}</div><div class="s">${r[1]}</div></div></div>`).join("")}
    <div class="card" style="margin-top:12px"><b>실행 저항</b><div class="small">회의 없이 확정되는 데 대한 불안 → 예외 기준을 함께 정하고 판단 B로 통제를 남겨요</div></div>
    <div class="card"><b>비용</b><div class="small">데이터 자동 연동·검증 구축, 판단 기준 유지·관리 공수</div></div>
    <div class="card" style="background:var(--warn-pale)"><b style="color:var(--warn)">첫 실행 한 가지</b><div class="small" style="color:var(--ink)">판매실적·딜러주문 수집 양식을 하나로 통일해 중복 입력부터 없애요 ('빨리 하기')</div></div>
    <div class="src">출처: (가정: 표의 모든 수치) · 개선안 선정 기준·TO-BE 판단 기준, 기록 4~5쪽</div>`,
  cta:()=>({label:"한 장으로 보기",go:"summary"}) },

/* =========================================================
   6. 차트 (실적 + 백테스트 + 예측 + 범위)
   ========================================================= */
function chartSVG(a){
  const W=342,Hh=190,m={l:38,r:12,t:12,b:24}; const show=12, y=a.y.slice(-show), n=y.length, N=n+H;
  const bt=a.r.fc; const all=[...y,...a.band.flat(),...bt.filter(v=>v!=null)];
  let lo=Math.min(...all),hi=Math.max(...all); const pad=(hi-lo)*.12||10; lo-=pad; hi+=pad;
  const X=i=>m.l+i*(W-m.l-m.r)/(N-1), Y=v=>m.t+(hi-v)/(hi-lo)*(Hh-m.t-m.b);
  let g=""; const step=niceStep((hi-lo)/4);
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#F2F4F6"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#8B95A1">${fmt(v)}</text>`;
  for(let i=0;i<N;i+=3) g+=`<text x="${X(i)}" y="${Hh-6}" text-anchor="middle" font-size="10" fill="#8B95A1">${mLabel(a.y.length-show+i).slice(5)}월</text>`;
  g+=`<rect x="${X(n-.5)}" y="${m.t}" width="${X(N-1)-X(n-.5)+6}" height="${Hh-m.t-m.b}" fill="#FFF7EE" rx="6"/>`;
  const bp=[[X(n-1),Y(y[n-1])],...a.band.map((b,k)=>[X(n+k),Y(b[1])]),...a.band.slice().reverse().map((b,k)=>[X(N-1-k),Y(b[0])])];
  g+=`<path d="M${bp.map(p=>p.join(" ")).join(" L")}Z" fill="#F3D3AE" opacity=".65"/>`;
  g+=`<path d="M${y.map((v,i)=>X(i)+" "+Y(v)).join(" L")}" fill="none" stroke="#2563B8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const btp=bt.map((v,k)=>v==null?null:[X(n-BT+k),Y(v)]).filter(Boolean);
  g+=`<path d="M${btp.map(p=>p.join(" ")).join(" L")}" fill="none" stroke="#C96A00" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/>`;
  const fp=[[X(n-1),Y(y[n-1])],...a.future.map((v,k)=>[X(n+k),Y(v)])];
  g+=`<path d="M${fp.map(p=>p.join(" ")).join(" L")}" fill="none" stroke="#C96A00" stroke-width="2.2" stroke-dasharray="5 4"/>`;
  a.future.forEach((v,k)=>g+=`<circle cx="${X(n+k)}" cy="${Y(v)}" r="4" fill="#C96A00" stroke="#fff" stroke-width="2"/>`);
  g+=`<line id="cx" y1="${m.t}" y2="${Hh-m.b}" stroke="#B0B8C1" stroke-dasharray="3 3" opacity="0"/><rect id="chit" x="${m.l}" y="0" width="${W-m.l-m.r}" height="${Hh}" fill="transparent"/>`;
  chartSVG.geo={X,N,n,show,W,m,a,y};
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(a.name)} 최근 12개월 실적과 3개월 예측">${g}</svg>`;
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const f=r/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function bindChart(el){
  const box=el.querySelector("#chart"); if(!box) return; const svg=box.querySelector("svg"), hit=svg.querySelector("#chit"), cx=svg.querySelector("#cx"), tip=box.querySelector("#ctip");
  const G=chartSVG.geo;
  const move=ev=>{ const r=svg.getBoundingClientRect(); const px=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*G.W;
    const i=Math.max(0,Math.min(G.N-1,Math.round((px-G.m.l)/((G.W-G.m.l-G.m.r)/(G.N-1)))));
    cx.setAttribute("x1",G.X(i)); cx.setAttribute("x2",G.X(i)); cx.setAttribute("opacity","1");
    const gi=G.a.y.length-G.show+i; let t=`<b>${mLabel(gi)}</b> `;
    if(i<G.n){ t+=`실적 ${fmt(G.y[i])}`; const bi=i-(G.n-BT); if(bi>=0&&G.a.r.fc[bi]!=null) t+=` · 미리 맞힌 값 ${fmt(G.a.r.fc[bi])}`; }
    else { const k=i-G.n; t+=`예측 ${fmt(G.a.future[k])} (${fmt(G.a.band[k][0])}~${fmt(G.a.band[k][1])})`; }
    tip.innerHTML=t; const x=G.X(i)/G.W*r.width; tip.style.left=Math.max(0,Math.min(r.width-tip.offsetWidth,x-tip.offsetWidth/2))+"px"; tip.style.opacity="1"; };
  hit.addEventListener("pointermove",move); hit.addEventListener("pointerdown",move);
  hit.addEventListener("pointerleave",()=>{cx.setAttribute("opacity","0");tip.style.opacity="0";});
}
async function fillNames(el){
  const ids=[...el.querySelectorAll("[data-name]")].map(e=>e.dataset.name).filter(Boolean); if(!ids.length) return;
  const nm=await names(ids); el.querySelectorAll("[data-name]").forEach(e=>{ e.textContent=nm[e.dataset.name]||"팀원"; });
}

/* =========================================================
   7. 화면 전환 (스택 내비게이션)
   ========================================================= */
const nav={
  stack:[], cur(){return this.stack[this.stack.length-1];},
  push(id){ if(id==="loading") id="result"; this.stack.push(id); show(id,"fwd"); },
  replace(id){ if(id==="loading") id="result"; this.stack[this.stack.length-1]=id; show(id,"fwd"); },
  back(){ if(this.stack.length>1){ this.stack.pop(); show(this.cur(),"back"); } },
  reset(id){ this.stack=[id]; show(id,"fwd"); }
};
let curEl=null;
function show(id,dir){
  const sc=SCREENS[id];
  // 화면 진입 시 저장은 시작하지만 완료를 기다리지는 않습니다.
  if(sc.enter) sc.enter();
  const el=document.createElement("div"); el.className="screen";
  el.innerHTML=frame(id);
  if(curEl) curEl.remove();
  $("phone").appendChild(el);
  curEl=el;
  if(sc.mount) sc.mount(el);
}
function frame(id){
  const sc=SCREENS[id]; const canBack=nav.stack.length>1 && !sc.noBack;
  let top="";
  if(!sc.noBar){
    top=`<div class="topbar">${canBack?`<button class="iconbtn" data-back aria-label="뒤로">${ICON.back}</button>`:`<span style="width:40px"></span>`}
      <div class="title">${sc.title||""}</div>
      ${sc.noHome?`<span style="width:40px;margin-left:-40px"></span>`:id!=="home"?`<button class="iconbtn" data-home aria-label="홈" style="margin-left:-40px">${ICON.home}</button>`:`<button class="iconbtn" data-profile aria-label="내 정보·로그아웃" style="margin-left:-40px">${avatarHTML(S.account,30)}</button>`}</div>`;
    if(sc.ch!=null) top+=`<div class="chap">${CH.map((c,i)=>`<div class="${i<sc.ch?'done':i===sc.ch?'on':''}"><i></i>${c}</div>`).join("")}</div>`;
  }
  const c=sc.cta?sc.cta():null;
  return `${top}<div class="body">${sc.html()}</div>${c?`<div class="cta"><button class="btn" data-cta ${c.disabled?"disabled":""}>${c.label}</button></div>`:""}${tabBar(id)}`;
}
function refresh(){ // 현재 화면만 다시 그림 (전환 없이)
  if(!curEl) return; const id=nav.cur(); if(["loading","splash"].includes(id)) return;
  const sc=SCREENS[id]; const body=curEl.querySelector(".body"); const st=body?body.scrollTop:0;
  curEl.innerHTML=frame(id); const nb=curEl.querySelector(".body"); if(nb) nb.scrollTop=st;
  if(sc.mount && id!=="merge") sc.mount(curEl);
  if(id==="merge") curEl.querySelectorAll(".check").forEach((c,i)=>{ const is=issues(); c.classList.add(i===3&&(is.gaps.length+is.missing.length)?"warn":"done"); });
}

function openSheet(html,onClose){ $("sheetBody").innerHTML=html; $("sheet").classList.add("on"); $("dim").classList.add("on"); openSheet.onClose=onClose; }
function closeSheet(){ $("sheet").classList.remove("on"); $("dim").classList.remove("on"); if(openSheet.onClose) openSheet.onClose(); openSheet.onClose=null; }
$("dim").addEventListener("click",closeSheet);

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-go]"); if(!t) return;
  const d=t.dataset;
  if(d.tab){ closeSheet(); return nav.reset(d.tab); }
  if(d.auditFilter){ S.auditFilter=d.auditFilter; refresh(); return; }
  if(d.auditRefresh!=null) return loadAudit();
  if(d.back!=null) return nav.back();
  if(d.home!=null) return nav.reset("home");
  if(d.profile!=null) return openProfile();
  if(d.logout!=null) return logout();
  if(d.sheetgo){ closeSheet(); return nav.push(d.sheetgo); }
  if(d.go) return nav.push(d.go);
  if(d.cta!=null){ const c=SCREENS[nav.cur()].cta(); if(!c||c.disabled) return; if(typeof c.go==="function") return c.go(); return nav.push(c.go); }
  if(d.demo!=null){ S.pinFor=DEMO_ACCOUNT; S.pin=""; S.pinStage="check"; S.pinRole=DEMO_ACCOUNT.role; S.pinErr=""; return nav.push("pin"); }
   if(d.acc){ const a=S.accounts.find(x=>x.id===d.acc); if(!a) return; S.pinFor=a; S.pin=""; S.pinStage=a.hasPin?"check":"set"; S.pinRole=a.role||null; S.pinErr=""; return nav.push("pin"); }
  if(d.pinrole){ S.pinRole=d.pinrole; refresh(); return; }
  if(d.surole){ const el=$("suName"); if(el) S.suName=el.value; S.suRole=d.surole; refresh(); return; }
  if(d.key!=null){ return pinKey(d.key); }
  if(d.model){ S.selModel=d.model; return nav.push("detail"); }
  if(d.method){ S.method[S.selModel]=d.method; refresh(); return; }
  if(d.fill){ const [k,i,v]=d.fill.split("|"); S.dataset.series[k][+i]=+v; refresh(); toast("추정치로 채웠어요"); await saveDataset(`${k} ${mLabel(+i)} 빈 값을 추정치 ${fmt(+v)}대로 채움`); return; }
  if(d.input){ const [k,i]=d.input.split("|");
    openSheet(`<h1 style="font-size:21px">${esc(k)} ${mLabel(+i)}<br>판매실적을 입력해 주세요</h1><input class="field num" id="sheetIn" inputmode="numeric" placeholder="예: 315" style="margin:10px 0 14px"><button class="btn" style="width:100%" id="sheetOk">입력 완료</button>`);
    setTimeout(()=>$("sheetIn")&&$("sheetIn").focus(),300);
    $("sheetOk").onclick=async()=>{ const v=+($("sheetIn").value||"").replace(/[^\d]/g,""); if(!v){ toast("숫자를 입력해 주세요"); return; } S.dataset.series[k][+i]=v; closeSheet(); refresh(); toast("입력했어요"); await saveDataset(`${k} ${mLabel(+i)} 판매실적 ${fmt(v)}대 입력`); };
    return; }
  if(d.assign){ const [i,k]=d.assign.split("|"); const o=S.dataset.orders[+i]; let note;
    if(k==="__drop"){ S.dataset.orders.splice(+i,1); note=`딜러주문 ${o.no} 제외`; } else { o.model=k; note=`딜러주문 ${o.no} 차종을 ${k}(으)로 지정`; }
    refresh(); toast("반영했어요"); await saveDataset(note); return; }
  if(d.sheet==="limit"){
    openSheet(`<h1 style="font-size:21px">자동 확정 기준</h1><p class="lead">최근 6개월 예측 오차가 이 안이면 회의 없이 확정해요.</p>
      <div class="big num" id="limV" style="text-align:center;color:var(--pri)">±${S.limit}%</div><input type="range" id="limR" min="3" max="20" value="${S.limit}" style="margin:16px 0 18px">
      <button class="btn" style="width:100%" id="limOk">적용</button>`, ()=>{ refresh(); saveLimit(); });
    $("limR").oninput=ev=>{ S.limit=+ev.target.value; $("limV").textContent="±"+S.limit+"%"; };
    $("limOk").onclick=closeSheet; return; }
  if(d.step){ const [k,dv]=d.step.split("|"); S.agreed[k].qty=Math.max(0,(+S.agreed[k].qty||0)+(+dv)); refresh(); return; }
  if(d.memo){ const [k,m]=d.memo.split("|"); S.agreed[k].memo=S.agreed[k].memo===m?"":m; refresh(); return; }
  if(d.copy!=null){ const p=S.lastPlan; const txt=[`[${planMonthKo()} 판매계획 확정 · ${TEAM}]`,`자동 ${p.auto} · 협의 ${p.exceptions} · 합계 ${fmt(p.total)}대 · 기준 ±${p.limit}%`,...p.items.map(i=>`- ${i.model}: ${fmt(i.qty)}대 (${i.status}${i.memo?" / "+i.memo:""})`)].join("\n");
    try{ await navigator.clipboard.writeText(txt); toast("복사했어요"); }catch(err){ openSheet(`<h1 style="font-size:20px">아래 내용을 길게 눌러 복사하세요</h1><textarea class="field" style="height:200px" readonly>${esc(txt)}</textarea>`); } return; }
});
document.addEventListener("input",e=>{ if(e.target.id==="suName") S.suName=e.target.value; });
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.qty){ S.agreed[t.dataset.qty].qty=+t.value.replace(/[^\d]/g,"")||0; refresh(); }
  if(t.dataset.special){ S.special[t.dataset.special]=t.checked; refresh(); }
});

async function pinKey(k){
  if(S.pinBusy) return;
  if(k==="←"){ S.pin=S.pin.slice(0,-1); return refresh(); }
  if(S.pin.length>=4) return;
  S.pin+=k; S.pinErr=""; refresh();
  if(S.pin.length<4) return;
  const a=S.pinFor, pin=S.pin; S.pinBusy=true;
  // 모든 팀원의 PIN 입력 직후 즉시 서버 인증을 시작합니다. 인위적인 대기는 없습니다.
  if(S.pinStage==="check" && a.id!==DEMO_ACCOUNT.id){
    const msg=$("pinMsg"); if(msg) msg.textContent="비밀번호 확인 중…";
  }
  try{
    if(S.pinStage==="check"){
      if(a.id===DEMO_ACCOUNT.id){
        if(pin!=="0000") throw Object.assign(new Error("가상 체험 PIN은 0000입니다"),{status:401});
        startDemo();
      } else {
        if(!S.online && a.pin!==pin) throw Object.assign(new Error("비밀번호가 달라요"),{status:401});
        await apiLogin(a,pin); nav.reset("home"); toast(`${a.name}님, 반가워요`);
      }
    } else if(S.pinStage==="set"){ S.pinFirst=pin; S.pin=""; S.pinStage="confirm"; refresh(); }
    else {
      if(pin!==S.pinFirst){ S.pin=""; S.pinStage="set"; S.pinErr="두 번 입력한 비밀번호가 달라요. 다시 정해 주세요"; refresh(); }
      else { if(a.isNew) await apiCreate(a.name,S.pinRole,pin); else await apiSetPin(a,S.pinRole,pin); nav.reset("home"); toast("비밀번호를 정하고 로그인했어요"); }
    }
  }catch(e){ S.pin=""; S.pinErr=e.message||"다시 시도해 주세요"; if(e.status===409&&e.data&&e.data.needPin){ S.pinStage="set"; } refresh(); }
  finally{ S.pinBusy=false; }
}
/* =========================================================
   9. 시작
   ========================================================= */
nav.reset("splash");
boot().then(()=>{ nav.reset(S.account?"home":"login"); if(S.resumed) toast(`${S.account.name}님, 로그인 상태를 이어서 보여드려요`); else if(!S.online) toast("서버에 연결하지 못해 둘러보기 모드로 열었어요"); }).catch(()=>nav.reset("login"));
</script>
